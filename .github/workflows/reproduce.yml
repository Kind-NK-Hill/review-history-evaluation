name: Verify and recompute study
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication hashes
        run: python verify_release.py
      - name: Validate table input checks
        run: python report-v28/test_reproduce.py
      - name: Recompute from bundled inputs
        run: python report-v28/reproduce.py --output "${{ runner.temp }}/study-recomputed"
